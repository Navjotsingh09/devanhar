name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test CMS access and publishing boundaries
        run: node --test scripts/test-blog-access.mjs scripts/test-sfi-cms.mjs scripts/test-dashboard-access.mjs scripts/test-submissions-pagination.mjs

      - name: Build application
        run: npm run build
